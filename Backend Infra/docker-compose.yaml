services:

  memory:

    image: vllm/vllm-openai:latest

    container_name: llm-memory

    runtime: nvidia

    ports:
      - "8003:8000"

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

    ipc: host

    environment:
      - HF_TOKEN=${HF_TOKEN}

    command:

      - --model
      - Qwen/Qwen2.5-0.5B-Instruct

      - --max-model-len
      - "12288"

      - --max-num-seqs
      - "1"

      - --max-num-batched-tokens
      - "12288"

      - --gpu-memory-utilization
      - "0.80"

      - --enforce-eager

      - --kv-cache-dtype
      - fp8

    deploy:

      resources:

        reservations:

          devices:

            - driver: nvidia

              count: all

              capabilities: [gpu]